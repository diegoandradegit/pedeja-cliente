# ─────────────────────────────────────────────────────────────────────────────
# Configuracao unica para os tres sites.
#
# Qual app cada site publica e decidido pela variavel de ambiente APP_ALVO
# (cliente | entregador | restaurante), definida no painel de cada site — NAO
# pelo campo "package directory". Este mesmo arquivo esta replicado em
# apps/*/netlify.toml para que o resultado seja o mesmo qualquer que seja a
# pasta que a Netlify resolva ler.
#
# O build roda sempre a partir da raiz do repo, monta o app escolhido e copia
# o resultado para ./dist, que e o unico caminho publicado.
# ─────────────────────────────────────────────────────────────────────────────
[build]
  command = ": \"${APP_ALVO:?defina APP_ALVO no painel do site: cliente | entregador | restaurante}\" && pnpm --filter @pedeja/$APP_ALVO... build && rm -rf dist && cp -r apps/$APP_ALVO/dist dist"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
