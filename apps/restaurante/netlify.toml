# Este site usa o modo monorepo do Netlify (packagePath = apps/restaurante).
# Nesse modo o build roda a partir da RAIZ do repositorio, entao todos os
# caminhos abaixo sao relativos a raiz — nao a esta pasta.
[build]
  command = "pnpm --filter @pedeja/restaurante... build"
  publish = "apps/restaurante/dist"
  # Usa os refs que a propria Netlify injeta. Na primeira build
  # CACHED_COMMIT_REF nao existe, o comando falha e a build acontece — que e
  # o comportamento desejado.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- apps/restaurante packages pnpm-lock.yaml"

[build.environment]
  NODE_VERSION = "20"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), camera=(), microphone=()"
